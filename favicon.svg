<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="tabBg" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#221a14" />
      <stop offset="70%" stop-color="#13100d" />
      <stop offset="100%" stop-color="#0a0908" />
    </radialGradient>
    <linearGradient id="hubRim" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffaa59" />
      <stop offset="50%" stop-color="#ea833e" />
      <stop offset="100%" stop-color="#b8481a" />
    </linearGradient>
    <radialGradient id="centerPulse" cx="32" cy="32" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea833e" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ea833e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ea833e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circular Outer Badge Disc -->
  <circle cx="32" cy="32" r="29.5" fill="url(#tabBg)" stroke="url(#hubRim)" stroke-width="2.6" />

  <!-- Center Ambient Hub Glow -->
  <circle cx="32" cy="32" r="16" fill="url(#centerPulse)" />

  <!-- Peripheral Connector Polygon Mesh -->
  <polygon
    points="32,11.5 48.9,21.25 48.9,40.75 32,50.5 15.1,40.75 15.1,21.25"
    stroke="url(#hubRim)"
    stroke-width="1.8"
    stroke-linejoin="round"
    stroke-opacity="0.55"
    fill="rgba(214, 106, 42, 0.08)"
  />

  <!-- Radial Connector Spokes -->
  <line x1="32" y1="32" x2="32" y2="11.5" stroke="url(#hubRim)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="32" y1="32" x2="48.9" y2="21.25" stroke="url(#hubRim)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="32" y1="32" x2="48.9" y2="40.75" stroke="url(#hubRim)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="32" y1="32" x2="32" y2="50.5" stroke="url(#hubRim)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="32" y1="32" x2="15.1" y2="40.75" stroke="url(#hubRim)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="32" y1="32" x2="15.1" y2="21.25" stroke="url(#hubRim)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Central Nexus Ring -->
  <circle cx="32" cy="32" r="7.8" stroke="url(#hubRim)" stroke-width="2.2" fill="#1c1410" />

  <!-- Central Core Node -->
  <circle cx="32" cy="32" r="4.2" fill="#ff9d47" />
  <circle cx="32" cy="32" r="1.8" fill="#fff5ec" />

  <!-- 6 Peripheral Satellite Nodes -->
  <circle cx="32" cy="11.5" r="3.3" fill="#ff9d47" stroke="#1c1410" stroke-width="1.5" />
  <circle cx="48.9" cy="21.25" r="3.3" fill="#ff9d47" stroke="#1c1410" stroke-width="1.5" />
  <circle cx="48.9" cy="40.75" r="3.3" fill="#ea833e" stroke="#1c1410" stroke-width="1.5" />
  <circle cx="32" cy="50.5" r="3.3" fill="#ea833e" stroke="#1c1410" stroke-width="1.5" />
  <circle cx="15.1" cy="40.75" r="3.3" fill="#ea833e" stroke="#1c1410" stroke-width="1.5" />
  <circle cx="15.1" cy="21.25" r="3.3" fill="#ff9d47" stroke="#1c1410" stroke-width="1.5" />
</svg>