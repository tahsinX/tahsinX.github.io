<body>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // =========================================================================

        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
        </svg>
      ),
      LinkedIn: () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
        </svg>
      ),
      X: () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
        </svg>
      ),
      Facebook: () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
        </svg>
      ),
      Close: () => (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      )
    };

    // =========================================================================
    // DATA: THE 5 SOCIAL LINKS
    // =========================================================================
    const SOCIAL_LINKS = [
      {
        name: 'Portfolio',
        url: 'https://ibnultahsinrihan.vercel.app/',
        icon: <Icons.Portfolio />
      },
      {
        name: 'GitHub',
        url: 'https://github.com/tahsinX',
        icon: <Icons.GitHub />
      },
      {
        name: 'LinkedIn',
        url: 'https://www.linkedin.com/in/ibnul-tahsin-rihan-875b45256/',
        icon: <Icons.LinkedIn />
      },
      {
        name: 'X',
        url: 'https://x.com/tahsinrihanX',
        icon: <Icons.X />
      },
      {
        name: 'Facebook',
        url: 'https://www.facebook.com/ibnultahsinrihan',
        icon: <Icons.Facebook />
      }
    ];

    // =========================================================================
    // COMPONENT: Custom Precision Cursor
    // =========================================================================
    const CustomCursor = ({ isHovered }) => {
      const [pos, setPos] = useState({ x: -100, y: -100 });

      useEffect(() => {
        const handleMove = (e) => setPos({ x: e.clientX, y: e.clientY });
        window.addEventListener('mousemove', handleMove);
        return () => window.removeEventListener('mousemove', handleMove);
      }, []);

      return (
        <>
          <div
            className={`cursor-outer ${isHovered ? 'hovered' : ''}`}
            style={{ left: `${pos.x}px`, top: `${pos.y}px` }}
          />
          <div
            className="cursor-inner"
            style={{ left: `${pos.x}px`, top: `${pos.y}px` }}
          />
        </>
      );
    };

    // =========================================================================
    // COMPONENT: Ambient Floating Embers
    // =========================================================================
    const AmbientBackground = () => {
      const [embers, setEmbers] = useState([]);

      useEffect(() => {
        const items = Array.from({ length: 32 }, (_, i) => ({
          id: i,
          left: Math.random() * 100,
          delay: Math.random() * 16,
          duration: 12 + Math.random() * 8,
          size: Math.random() > 0.6 ? 4 : 2.5
        }));
        setEmbers(items);
      }, []);

      return (
        <div className="ambient-background">
          <div className="ambient-grid"></div>
          <div className="grain-overlay"></div>
          {embers.map((ember) => (
            <div
              key={ember.id}
              className="ember-particle"
              style={{
                left: `${ember.left}%`,
                animationDelay: `${ember.delay}s`,
                animationDuration: `${ember.duration}s`,
                width: `${ember.size}px`,
                height: `${ember.size}px`
              }}
            />
          ))}
        </div>
      );
    };

    // =========================================================================
    // COMPONENT: Secret Easter Egg Modal
    // =========================================================================
    const EasterEggModal = ({ isOpen, onClose }) => {
      if (!isOpen) return null;

      return (
        <div className="easter-egg-terminal" onClick={onClose}>
          <div className="terminal-box" onClick={(e) => e.stopPropagation()}>
            <div className="terminal-topbar">
              <span className="terminal-title">ESPRESSO CORE v2.6.4 // EASTER EGG</span>
              <button
                onClick={onClose}
                style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer' }}
              >
                <Icons.Close />
              </button>
            </div>
            <div className="terminal-body">
              <p style={{ color: '#ea833e', marginBottom: '0.8rem' }}>
                &gt; USER: Ibnul Tahsin Rihan (@tahsinX)<br />
                &gt; THEME: Dark Espresso & Burnt Orange<br />
                &gt; STATUS: Fully Active & Tactile
              </p>
              <p style={{ color: 'var(--text-secondary)' }}>
                You discovered the secret terminal! The redesign is built on pure React & Vanilla CSS with GPU-accelerated micro-interactions.
              </p>
              <p style={{ marginTop: '1.2rem' }}>
                <span style={{ color: 'var(--accent-orange)' }}>tahsinX:~$</span> echo "Welcome to the hub"
                <span className="terminal-cursor"></span>
              </p>
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    const App = () => {
      const [isHovered, setIsHovered] = useState(false);
      const [easterEggOpen, setEasterEggOpen] = useState(false);
      const [clicks, setClicks] = useState(0);

      const handleMonogramClick = () => {
        const next = clicks + 1;
        setClicks(next);
        if (next >= 3) {
          setEasterEggOpen(true);
          setClicks(0);
        }
      };

      return (
        <>
          <AmbientBackground />
          <CustomCursor isHovered={isHovered} />

          <div className="page-wrapper">
            <div></div>

            <main className="main-content">
              <div className="decorative-line"></div>

              <div
                className="monogram-badge"
                onClick={handleMonogramClick}
                title="TR"
                onMouseEnter={() => setIsHovered(true)}
                onMouseLeave={() => setIsHovered(false)}
              >
                TR
              </div>

              <h1 className="hero-name">Ibnul Tahsin Rihan</h1>

              <div className="hero-title">
                <span>Frontend Developer</span>
              </div>

              <div className="links-grid">
                {SOCIAL_LINKS.map((link) => (
                  <a
                    key={link.name}
                    href={link.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="social-card"
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                  >
                    <span className="card-icon">{link.icon}</span>
                    <span className="card-name">{link.name}</span>
                  </a>
                ))}
              </div>

              <div className="decorative-line" style={{ marginTop: '2.5rem' }}></div>
            </main>

            <footer className="hub-footer">
              &copy; {new Date().getFullYear()} Ibnul Tahsin Rihan
            </footer>
          </div>

          <EasterEggModal
            isOpen={easterEggOpen}
            onClose={() => setEasterEggOpen(false)}
          />
        </>
      );
    };

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
